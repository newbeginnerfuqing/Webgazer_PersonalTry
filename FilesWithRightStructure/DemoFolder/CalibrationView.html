<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Eye-track experiment based on webgazer</title>
</head>

<body>
    <div class="CalibrationPoints"
        style="background-color: antiquewhite; width: 90vw; height: 90vh; position: relative; margin: 5vh 5vw">

    </div>

</body>

<script>
    AllPos = [[10, 10], [50, 10], [90, 10],
    [10, 50], [50, 50], [90, 50],
    [10, 90], [50, 90], [90, 90]];

    AllPoint = [];

    ClickColor = { 0: 'black', 1: 'blue', 2: 'green', 3: 'orange', 4: 'red', 5: 'white' };


    function CreateAllCalibrationPoint() {
        var PointFather = document.querySelector('.CalibrationPoints');
        if (PointFather == null) {
            console.log("Point Father is missing!!!")
        }
        var PointFatherRect = PointFather.getBoundingClientRect();

        AllPos.forEach(pointPos => {
            var pointEle = document.createElement('div');
            PointFather.appendChild(pointEle);

            pointEle.style.borderRadius = '50%'
            pointEle.style.width = '20px';
            pointEle.style.height = '20px';

            pointEle.style.position = 'absolute';
            pointEle.style.left = `${PointFatherRect.width * pointPos[0] / 100}px`;
            pointEle.style.top = `${PointFatherRect.height * pointPos[1] / 100}px`;

            pointEle.dataset.clickNum = 0;
            pointEle.style.backgroundColor = ClickColor[pointEle.dataset.clickNum];
            pointEle.style.cursor = 'pointer';

            pointEle.style.display = 'block';

            AllPoint.push(pointEle);
        });

        // webgazer.resume();
        ShowNextCalibrationPoint();

    }

    function ShowNextCalibrationPoint() {
        if (AllPoint.length == 0) {
            // webgazer.pause();

            alert('Go to validation part!!');
            return;
        }
        var CurButton = AllPoint.shift();

        CurButton.style.display = 'block';
        CurButton.addEventListener('click', function () {
            OnClickCalibrationPoint(CurButton);
        });
    }

    MAX_CLICK_TIME = 5;

    function OnClickCalibrationPoint(button) {
        var clickTime = button.dataset.clickNum
        clickTime++;

        button.dataset.clickNum = clickTime;
        button.style.backgroundColor = ClickColor[clickTime];

        if (clickTime == MAX_CLICK_TIME) {
            button.style.display = 'none';
            ShowNextCalibrationPoint();
        }
    }


    CreateAllCalibrationPoint();

</script>

</html>
